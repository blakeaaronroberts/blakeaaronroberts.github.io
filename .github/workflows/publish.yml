name: Render & deploy site

on:
  push:
    branches: [main]
    paths-ignore: ['docs/SCRIBE_*.md', 'docs/STEWARD_HANDOFF.md']
  workflow_dispatch:        # allow manual re-deploys from the Actions tab

# No permissions by default; each job asks for what it needs.
permissions: {}

# One deploy at a time; let an in-progress deploy finish instead of cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to a commit (the tag is in the comment); .github/dependabot.yml proposes updates.
jobs:
  test:
    name: Tests and privacy scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Quarto (bundles Deno)
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: 1.11.9   # match local version for reproducible renders

      - name: Schematic editor tests
        run: quarto run tools/schematic-editor/test/run.js
      - name: Timing tests
        run: quarto run tools/timing/test/run.js
      - name: Figure editor tests
        run: quarto run tools/figure-editor/test/run.js
      - name: Privacy scan (tracked files)
        run: quarto run scripts/privacy-scan.js

  build:
    needs: test               # nothing deploys unless the tests and the scan pass
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: 1.11.9

      - name: Render site
        uses: quarto-dev/quarto-actions/render@8a96df13519ee81fd526f2dfca5962811136661b # v2

      - name: Third-party scripts carry integrity hashes
        run: quarto run scripts/sri.js --check
      - name: Privacy scan (tracked files and rendered site)
        run: quarto run scripts/privacy-scan.js

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload _site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
