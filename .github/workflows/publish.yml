name: Render & deploy site

on:
  push:
    branches: [main]
    paths-ignore: ['docs/SCRIBE_*.md', 'docs/STEWARD_HANDOFF.md']
  workflow_dispatch:        # allow manual re-deploys from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress deploy finish instead of cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9   # match local version for reproducible renders

      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2

      - uses: actions/configure-pages@v5

      - name: Upload _site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
