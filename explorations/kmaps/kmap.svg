<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="STIX Two Text, Times New Roman, serif">
  <title>Four-variable K-map for F = Σm(0,1,2,5,8,9,10) with prime-implicant groupings</title>
  <rect width="540" height="340" rx="12" fill="#FFFFFF"/>
  <!-- axis labels -->
  <text x="200" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#000000">CD</text>
  <text x="26" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#000000">AB</text>
  <g font-family="Fira Mono, Consolas, monospace" font-size="13" fill="#000000" fill-opacity="0.64" text-anchor="middle">
    <text x="110" y="50">00</text><text x="170" y="50">01</text><text x="230" y="50">11</text><text x="290" y="50">10</text>
  </g>
  <g font-family="Fira Mono, Consolas, monospace" font-size="13" fill="#000000" fill-opacity="0.64" text-anchor="end">
    <text x="72" y="95">00</text><text x="72" y="155">01</text><text x="72" y="215">11</text><text x="72" y="275">10</text>
  </g>
  <!-- grid -->
  <g stroke="#000000" stroke-opacity="0.2" stroke-width="1.5" fill="none">
    <rect x="80" y="60" width="240" height="240"/>
    <line x1="140" y1="60" x2="140" y2="300"/><line x1="200" y1="60" x2="200" y2="300"/><line x1="260" y1="60" x2="260" y2="300"/>
    <line x1="80" y1="120" x2="320" y2="120"/><line x1="80" y1="180" x2="320" y2="180"/><line x1="80" y1="240" x2="320" y2="240"/>
  </g>
  <!-- groups: B'C' (orange, wraps top/bottom), B'D' (blue, four corners), A'C'D (green) -->
  <g fill="none" stroke-width="3">
    <g stroke="#D55E00"><rect x="84" y="64" width="112" height="52" rx="14"/><rect x="84" y="244" width="112" height="52" rx="14"/></g>
    <g stroke="#0072B2"><rect x="89" y="69" width="42" height="42" rx="10"/><rect x="269" y="69" width="42" height="42" rx="10"/><rect x="89" y="249" width="42" height="42" rx="10"/><rect x="269" y="249" width="42" height="42" rx="10"/></g>
    <g stroke="#009E73"><rect x="154" y="74" width="32" height="92" rx="12"/></g>
  </g>
  <!-- cell values (Gray-code order) -->
  <g font-family="Fira Mono, Consolas, monospace" font-size="20" text-anchor="middle">
    <g fill="#000000" font-weight="600">
      <text x="110" y="97">1</text><text x="170" y="97">1</text><text x="290" y="97">1</text>
      <text x="170" y="157">1</text>
      <text x="110" y="277">1</text><text x="170" y="277">1</text><text x="290" y="277">1</text>
    </g>
    <g fill="#000000" fill-opacity="0.4">
      <text x="230" y="97">0</text>
      <text x="110" y="157">0</text><text x="230" y="157">0</text><text x="290" y="157">0</text>
      <text x="110" y="217">0</text><text x="170" y="217">0</text><text x="230" y="217">0</text><text x="290" y="217">0</text>
      <text x="230" y="277">0</text>
    </g>
  </g>
  <!-- legend -->
  <g font-size="15" fill="#000000">
    <line x1="350" y1="96" x2="378" y2="96" stroke="#D55E00" stroke-width="4" stroke-linecap="round"/><text x="390" y="101">B′C′</text>
    <line x1="350" y1="130" x2="378" y2="130" stroke="#0072B2" stroke-width="4" stroke-linecap="round"/><text x="390" y="135">B′D′</text>
    <line x1="350" y1="164" x2="378" y2="164" stroke="#009E73" stroke-width="4" stroke-linecap="round"/><text x="390" y="169">A′C′D</text>
    <text x="350" y="232" font-size="13" fill="#000000" fill-opacity="0.64">F = Σm(0,1,2,5,8,9,10)</text>
    <text x="350" y="256" font-size="13" font-weight="700">F = B′C′ + B′D′ + A′C′D</text>
  </g>
</svg>
