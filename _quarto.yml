# Default (public) build: landing page only. This is what the GitHub Action deploys.
# Full site with drafts:  quarto preview --profile dev   (adds _quarto-dev.yml)
project:
  type: website
  output-dir: _site
  render:
    - index.qmd
  resources:
    - "assets/**"           # static files referenced from includes (e.g. WaveDrom lecture skin)

website:
  title: "Blake Roberts"
  description: "Analog, mixed-signal, and RF IC design, system-level design, and engineering education: course notes, explorations, and projects."
  site-url: https://blakeaaronroberts.github.io
  open-graph: true
  search: false
  navbar: true                  # bare navbar (dark-mode toggle only); links are added by the dev profile
  page-footer:
    left: "© 2026 Blake Roberts"     # CC BY-NC-SA notice lives on about.qmd and in each exploration's Reuse note

# IEEE style: captions "Fig. 1. Text" (below) and "TABLE I" + caption (above);
# in-text "Fig. 1", "Table I", and "(1)" for equations — write equation refs as (@eq-id).
# _includes/captions.html splits the label off each caption for styling.
crossref:
  fig-title: "Fig."
  fig-prefix: "Fig."
  tbl-title: "TABLE"
  tbl-prefix: "Table"
  tbl-labels: "roman I"    # TABLE I, II, III
  eq-prefix: ""
  title-delim: ":"         # not "." — Quarto treats "." as a path and rewrites it to "../.."; captions.html swaps ":" for IEEE's "."

date-format: "YYYY-MM-DD"

format:
  html:
    theme:
      light: [default, theme-light.scss, custom.scss]
      dark: [default, theme-dark.scss, custom.scss]
    respect-user-color-scheme: true   # first visit follows the OS setting; toggle overrides
    grid:                             # ~70ch measure at 16px Plex, with room for margin notes
      body-width: 700px
      margin-width: 260px
      sidebar-width: 250px
    html-math-method: mathjax
    csl: _csl/ieee.csl                # IEEE numeric citations [1] and reference list (citation-style-language/styles)
    toc: true
    code-copy: true
    link-external-newwindow: true
    include-in-header: _includes/fonts.html
    include-after-body: _includes/captions.html
