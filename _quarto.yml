# The whole site. This is what the GitHub Action deploys.
# Pre-launch (VISION.md §6): index.qmd is a landing page with no navigation. Every other page is
# published but reachable only by URL and marked noindex (_includes/noindex.html); their navbar
# links the whole site. At launch: replace index.qmd with home.qmd and remove the noindex includes.
project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "explorations/*/*.qmd"
    - "projects/*/*.qmd"
    - "docs/**/*.qmd"       # Scribe's pages; its handoff and to-do files are .md, so they are not rendered.
                            # Drafts go in docs/_drafts/: Quarto never renders "_" folders, so nothing reaches _site.
    - "!docs/templates/"    # page templates full of placeholders, not pages
    - "tools/*/index.qmd"   # web tools (unlisted, noindex via tools/_metadata.yml)
  resources:
    - "assets/**"           # static files referenced from includes (e.g. WaveDrom lecture skin)
    - "tools/*/src/**"      # web tools' ES modules, loaded by the page at run time
    - "tools/*/symbol-pack/**"   # the figure editor's pinned symbol pack (fetched at run time)
    - "tools/*/examples/*.json"  # sample figures (open with ?open=examples/<file>.json)

website:
  title: "Blake Roberts"
  description: "Analog, mixed-signal, and RF IC design, system-level design, and engineering education: course notes, explorations, and projects."
  site-url: https://blakeaaronroberts.github.io
  open-graph: true
  draft-mode: gone              # backstop for `draft: true` pages: hidden, but Quarto still writes an empty file at their address (use docs/_drafts/)
  search: true
  navbar:                       # hidden on the landing page (index.qmd), which keeps only the dark-mode toggle
    left:
      - href: home.qmd
        text: Home
      - href: explorations.qmd
        text: Explorations
      - href: projects.qmd
        text: Projects
      - href: about.qmd
        text: About / CV
      - text: Tools
        menu:
          - text: Figure editor
            href: tools/figure-editor/index.qmd
    right:
      - icon: github
        href: https://github.com/blakeaaronroberts
        aria-label: GitHub
  page-footer:
    left: "© 2026 Blake Roberts"     # no licence notice until one is chosen (VISION.md §3)

# IEEE style: captions "Fig. 1. Text" (below) and "TABLE I" + caption (above);
# in-text "Fig. 1", "Table I", and "(1)" for equations — write equation refs as (@eq-id).
# _includes/captions.html splits the label off each caption for styling.
crossref:
  fig-title: "Fig."
  fig-prefix: "Fig."
  tbl-title: "TABLE"
  tbl-prefix: "Table"
  tbl-labels: "roman I"    # TABLE I, II, III
  eq-prefix: ""
  title-delim: ":"         # not "." — Quarto treats "." as a path and rewrites it to "../.."; captions.html swaps ":" for IEEE's "."

date-format: "YYYY-MM-DD"

format:
  html:
    theme:
      # Figures, diagrams, plots and embed plates: the suite's universal theme (Okabe-Ito), always.
      # Site pages: the "blueprint" look. Alternate site look: quarto preview --profile okabe-ito
      light: [default, themes/okabe-ito/figures.scss, themes/blueprint/light.scss, custom.scss]
      dark: [default, themes/okabe-ito/figures.scss, themes/blueprint/dark.scss, custom.scss]
    respect-user-color-scheme: true   # first visit follows the OS setting; toggle overrides
    grid:                             # ~70ch measure at 16px, with room for margin notes
      body-width: 700px
      margin-width: 260px
      sidebar-width: 250px
    html-math-method:                 # MathJax 4 with STIX Two Math (VISION.md §7); version pinned
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/@mathjax/mathjax-stix2-font@4.1.3/tex-mml-chtml-mathjax-stix2.js"
    csl: _csl/ieee.csl                # IEEE numeric citations [1] and reference list (citation-style-language/styles)
    toc: true
    code-copy: true
    link-external-newwindow: true
    include-in-header:
      - themes/blueprint/fonts.html     # site pages (IBM Plex)
      - themes/okabe-ito/fonts.html     # figures (STIX Two Text, Fira Mono)
    include-after-body: _includes/captions.html
